name: Sync FlyBudget release
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional exact completed tag, e.g. v0.2.0-up.4'
        type: string
        required: false
permissions:
  contents: write
  attestations: read
concurrency:
  group: catalog-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - run: python3 -m unittest discover -s scripts
      - name: Verify and promote completed source release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          args=()
          if [ -n "$TAG" ]; then args+=(--tag "$TAG"); fi
          python3 scripts/sync-release.py "${args[@]}"
      - name: Commit catalog update
        run: |
          if [ -z "$(git status --porcelain -- flybudget_up)" ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add flybudget_up
          git commit -m "chore: promote verified FlyBudget release"
          git push
